# Left half only: it is the "central" that talks to the computer and receives
# everything from the right half.

# Right-half key presses, key releases, and every trackball movement arrive on
# the left half through one shared queue. ZMK's default holds only 5 events and
# silently drops anything that arrives while it is full, so a burst of
# trackball motion can push out a right-half key release, and the computer
# then thinks the key is still held. 64 slots is plenty of headroom.
CONFIG_ZMK_SPLIT_BLE_CENTRAL_POSITION_QUEUE_SIZE=64
