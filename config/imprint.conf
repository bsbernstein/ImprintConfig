CONFIG_ZMK_RGB_UNDERGLOW=y

# --- Bluetooth lag and stuck keys (2026-11-12) ---

# Trackball report rate. Cyboard's default sends a report every 8 ms, and each
# report crosses two radio links (right half -> left half -> computer). 12 ms
# sends a third fewer packets so the links don't back up; the ball still moves
# the same distance, it just batches the motion into slightly larger steps.
CONFIG_PMW3610_REPORT_INTERVAL_MIN=12

# Transmit at the nRF52840's full power (+8 dBm instead of 0 dBm) on both
# halves, for a stronger link to the laptop and between the halves. Costs a
# little battery.
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
